  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0c10;
      --text: #faf6f1;
      --muted: rgba(250, 246, 241, 0.72);
      --line: rgba(232, 215, 200, 0.22);
      --accent: #d8c4a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      line-height: 1.7;
    }
    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 72px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4.5vw, 40px);
      letter-spacing: 0.04em;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
    }
    .hero {
      margin: 0 0 28px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #111;
    }
    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }
    section {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      color: var(--accent);
      letter-spacing: 0.08em;
    }
    p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
    .device {
      margin-top: 12px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #111;
    }
    .device img {
      display: block;
      width: 100%;
      height: auto;
    }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: rgba(250, 246, 241, 0.4);
    }
  </style>
</head>
<body>
  <main>
    <h1>AIRロビンソン</h1>
    <p class="lead">Tandem AIR System のアプリ紹介ページです。</p>

    <div class="hero">
      <img
        src="images/airship_top.jpg"
        width="1200"
        height="675"
        alt="AIRロビンソン飛行船"
      >
    </div>

    <section>
      <h2>地球画面（実機）</h2>
      <p>航行中の地球画面です。実機の表示をそのまま掲載しています。</p>
      <div class="device">

          src="images/earth_device.jpg"
          width="1170"
          height="2532"
          alt="AIRロビンソン地球画面の実機表示"

    <section style="margin-top:36px;padding-top:24px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);">
      <h2 style="font-size:16px;color:var(--accent);">公式ドメイン</h2>
      <ul style="padding-left:1.2em;line-height:1.9;">
        <li><a href="https://tandemair.tokyo/" style="color:var(--accent);">tandemair.tokyo</a> — 本ページ（準備中）</li>
        <li><a href="https://aicode.tokyo/" style="color:var(--accent);">aicode.tokyo</a> — Elementary Code（準備中）</li>
        <li><a href="https://waseda-inspection.com/" style="color:var(--accent);">waseda-inspection.com</a> — 公開中</li>
        <li><a href="https://elementarycode.tokyo/" style="color:var(--accent);">elementarycode.tokyo</a> — 移行期公開中</li>
      </ul>
    </section>

    <section><h2>事業紹介</h2><p><a href="company.html" style="color:var(--accent);">早稲田インスペクションの事業紹介を見る</a></p></section>

      <p>© Tandem AIR System</p>
    </footer>
